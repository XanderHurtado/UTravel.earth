<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="banner-container">
      <iframe id="banner-video" src="https://www.youtube.com/embed/bpjdqOjsrTU?enablejsapi=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div id="banner-static-container">
        <img id="banner-cover-image" src="Banner.JPG" style="width:100%">
        <img src="Play Button.png" id="banner-play-button" onclick="playBannerVideo()">
        <div id="banner-left-container">
          <img id="banner-logo-img" src="Logo.png"><br>
          <h1 id="banner-left-main-text">Your Dream Destinations Made Real</h1>
          <p id="banner-left-sub-text">We Plan the Details. You Live the Adventure.</p>
        </div>
        <div id="banner-right-container">
          <div><a>Africa</a></div>
          <div><a>Asia</a></div>
          <div><a>Latin America</a></div>
          <div><a>North America</a></div>
        </div>
        <div id="banner-bottom-container">
          <div id="banner-bottom-bar">
            <div id="banner-bottom-bar-left-menu">
              <div class="banner-bar-top">Where?</div>
              <div class="banner-bar-drop-option">Africa</div>
              <div class="banner-bar-drop-option">Asia</div>
              <div class="banner-bar-drop-option">Latin America</div>
              <div class="banner-bar-drop-option">North America</div>
            </div>
            <div id="banner-bottom-bar-right-menu">
              <div class="banner-bar-top">When?</div>
              <div id="banner-bar-date-container" class="banner-bar-drop-option">
                <div id="banner-start-date-container">
                  <label for="start_date">From:</label>
                  <input type="date" id="banner-start-date" name="start_date">
                </div>
                <div id="banner-end-date-container">
                  <label for="end_date">To:</label>
                  <input type="date" id="banner-end-date" name="end_date">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
  </body>
</html>
