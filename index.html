<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="input-bar.css">
    <link rel="icon" type="image/png" href="Images/LogoIcon.png">
    <title>Utravel.earth</title>
    <!--<script async src="https://maps.googleapis.com/maps/api/js?loading=async&key=AIzaSyBha7mqg0b34voby1lp9hdf_Fx_6tOWDr8&libraries=maps3d"></script>-->
  </head>
  <body>
    <div id="banner-container">
      <iframe id="banner-video" src="https://www.youtube.com/embed/bpjdqOjsrTU?enablejsapi=1&mute=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div id="banner-static-container">
        <img id="banner-cover-image" src="Images/Banner.JPG" style="width:100%">
        <img src="Images/Play Button.png" id="banner-play-button" onclick="playBannerVideo()">
        <div id="banner-left-container">
          <img id="banner-logo-img" src="Images/Logo.png"><br>
          <h1 id="banner-left-main-text">Your Dream Destinations Made Real</h1>
          <p id="banner-left-sub-text">We Plan the Details. You Live the Adventure.</p>
        </div>
        <div id="banner-right-container">
          <div><a href="/kenya">Africa</a></div>
          <div><a>Asia</a></div>
          <div><a>Latin America</a></div>
          <div><a>North America</a></div>
        </div>
        <div id="banner-bottom-container">
          <div class="input-bar">
            <div class="input-bar-menu" id="input-bar-location-menu">
              <div class="input-bar-header">
                <label class="input-bar-header-icon" for="user-location-input">📍</label>
                <input type="text" id="user-location-input" class="input-bar-header-text" placeholder="Where?">
              </div>
              <div class="input-bar-option mouse-pointer">Africa</div>
              <div class="input-bar-option mouse-pointer">Asia</div>
              <div class="input-bar-option mouse-pointer">Latin America</div>
              <div class="input-bar-option mouse-pointer">North America</div>
            </div>
            <div class="input-bar-menu">
              <div class="input-bar-header"><p class="input-bar-header-icon">📅</p class="input-bar-header-text"><p>When?</p></div>
              <div id="banner-bar-date-container" class="input-bar-option">
                <div id="banner-start-date-container">
                  <label for="banner-start-date">From:</label>
                  <input type="date" id="banner-start-date">
                </div>
                <div id="banner-end-date-container">
                  <label for="banner-end-date">To:</label>
                  <input type="date" id="banner-end-date">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--<div id="world-map-container">
        <gmp-map-3d id="world-map" center="0,0,500" tilt="67.5" mode="hybrid">
        </gmp-map-3d>
    </div>-->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
  </body>
</html>
